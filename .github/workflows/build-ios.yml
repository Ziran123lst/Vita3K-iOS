name: iOS build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Bootstrap upstream (clone + overlay)
        run: bash Scripts/bootstrap.sh

      - name: Apply iOS patches
        run: bash Scripts/apply-patches.sh

      - name: Build (device)
        run: bash -x Scripts/build-ios.sh device

      - name: Package
        run: bash Scripts/package-ios.sh device

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vita3K-device
          path: |
            dist/
            build-device/bin/Vita3K.app
          if-no-files-found: error
