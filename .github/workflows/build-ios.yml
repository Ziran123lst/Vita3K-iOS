name: iOS build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Bootstrap upstream (clone + overlay)
        id: bootstrap
        run: |
          set -o pipefail
          bash -x Scripts/bootstrap.sh 2>&1 | tee bootstrap.log

      - name: Apply iOS patches
        id: apply
        run: |
          set -o pipefail
          bash -x Scripts/apply-patches.sh 2>&1 | tee apply-patches.log

      - name: Build (device)
        id: build
        run: |
          set -o pipefail
          bash -x Scripts/build-ios.sh device 2>&1 | tee build-device.log

      - name: Upload build log (kept even on failure)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-device-log
          path: build-device.log
          if-no-files-found: ignore

      - name: Push build log to ci-diag branch (readable without auth)
        if: always() && (steps.build.outcome == 'failure' || steps.bootstrap.outcome == 'failure' || steps.apply.outcome == 'failure')
        run: |
          set -e
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git checkout -B ci-diag origin/ci-diag 2>/dev/null || git checkout -b ci-diag
          for f in build-device.log bootstrap.log apply-patches.log; do
            if [ -f "$f" ]; then cp -f "$f" "ci-$f"; fi
          done
          git add -A ci-*.log
          git commit -m "ci: logs $(date -u +%Y%m%dT%H%M%SZ)" || true
          git push origin ci-diag --force

      - name: Package
        run: bash Scripts/package-ios.sh device

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vita3K-device
          path: |
            dist/
            build-device/bin/Vita3K.app
          if-no-files-found: error
