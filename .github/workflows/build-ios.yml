name: iOS build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Bootstrap upstream (clone + overlay)
        run: bash Scripts/bootstrap.sh

      - name: Apply iOS patches
        run: bash Scripts/apply-patches.sh

      - name: Build (device)
        id: build
        run: |
          set -o pipefail
          bash -x Scripts/build-ios.sh device 2>&1 | tee build-device.log

      - name: Upload build log (kept even on failure)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-device-log
          path: build-device.log
          if-no-files-found: ignore

      - name: Push build log to ci-diag branch (readable without auth)
        if: always() && steps.build.outcome == 'failure'
        run: |
          set -e
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git checkout -B ci-diag origin/ci-diag 2>/dev/null || git checkout -b ci-diag
          cp -f build-device.log ci-build-device.log
          git add ci-build-device.log
          git commit -m "ci: build log $(date -u +%Y%m%dT%H%M%SZ)" || true
          git push origin ci-diag --force

      - name: Package
        run: bash Scripts/package-ios.sh device

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vita3K-device
          path: |
            dist/
            build-device/bin/Vita3K.app
          if-no-files-found: error
